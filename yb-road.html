/* =========================

const NS="http://www.w3.org/2000/svg";


/* =========================
   SVG 요소 생성
========================= */

function el(tag,attrs,parent){

  const node=document.createElementNS(
    NS,
    tag
  );

  for(const [k,v] of Object.entries(attrs)){

    node.setAttribute(k,v);

  }

  parent.appendChild(node);

  return node;

}


/* =========================
   지역명 추출
========================= */

function cityKey(region){

  const p=String(region||"")
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  const normalize=name=>
    name.replace(
      /(특별자치시|특별자치도|광역시|특별시|자치시|시|군|구)$/,
      ""
    );

  const first=normalize(p[0]||"");

  const metro=[
    "서울",
    "인천",
    "광주",
    "대구",
    "대전",
    "부산",
    "울산",
    "세종",
    "제주"
  ];


  /* 경기도 광주와 광주광역시 구분 */

  if(
    /^(경기|경기도)$/.test(p[0]) &&
    p.some(x=>normalize(x)==="광주")
  ){

    return "경기광주";

  }


  /* 제주 서귀포 구분 */

  if(
    first==="제주" &&
    p.some(x=>normalize(x)==="서귀포")
  ){

    return "서귀포";

  }


  /* 광역시 */

  if(metro.includes(first)){

    return first;

  }


  /* 일반 시군 */

  for(const token of [...p].reverse()){

    const name=normalize(token);

    if(coords[name]){

      return name;

    }

  }


  return normalize(
    p[p.length-1]||""
  );

}


/* =========================
   공연 날짜 분리
========================= */

function dates(str){

  const normalized=String(str)
    .replace(/[–—~〜]/g,"-");

  const m=normalized.match(
    /^(\d{4})\.(\d{1,2})\.(\d{1,2})(?:\s*-\s*(?:(\d{4})\.)?(?:(\d{1,2})\.)?(\d{1,2}))?/
  );

  if(!m)return [];


  const year=Number(m[1]);

  const month=Number(m[2]);

  const day=Number(m[3]);


  const start=Date.UTC(
    year,
    month-1,
    day
  );


  const end=m[6]
    ?Date.UTC(
        Number(m[4]||year),
        Number(m[5]||month)-1,
        Number(m[6])
      )
    :start;


  if(end<start)return [];

  if(end-start>32*86400000)return [];


  const result=[];


  for(
    let t=start;
    t<=end;
    t+=86400000
  ){

    result.push(
      new Date(t)
        .toISOString()
        .slice(0,10)
        .replaceAll("-",".")
    );

  }


  return result;

}


/* =========================
   이동 경로 곡선
========================= */

function makeCurve(a,b,index){

  const dx=b[0]-a[0];

  const dy=b[1]-a[1];

  const dist=Math.hypot(dx,dy);


  /* 같은 위치는 선을 만들지 않음 */

  if(dist<2){

    return null;

  }


  const bend=
    Math.min(85,dist*.18)*
    (index%2?1:-1);


  const mx=(a[0]+b[0])/2;

  const my=(a[1]+b[1])/2;


  const nx=-dy/dist;

  const ny=dx/dist;


  return `
    M${a[0]},${a[1]}
    Q${mx+nx*bend},${my+ny*bend}
    ${b[0]},${b[1]}
  `;

}


/* =========================
   울릉도 / 독도 표시

   이름 없이 섬만 표시
========================= */

function addIsland(name,location,land){

  const xy=projection(location);

  if(!xy)return;


  const x=xy[0];

  const y=xy[1];


  if(name==="독도"){

    /* 독도 두 섬 */

    el("ellipse",{

      cx:x-3,
      cy:y,

      rx:3.5,
      ry:5,

      fill:"#555",
      stroke:"#888",
      "stroke-width":1

    },land);


    el("ellipse",{

      cx:x+4,
      cy:y+2,

      rx:2.5,
      ry:4,

      fill:"#555",
      stroke:"#888",
      "stroke-width":1

    },land);

  }

  else{

    /* 울릉도 */

    el("ellipse",{

      cx:x,
      cy:y,

      rx:7,
      ry:9,

      fill:"#555",
      stroke:"#888",
      "stroke-width":1.2

    },land);

  }

}


/* =========================
   작은 부속 섬 정리
========================= */

function simplifyFeature(feature,path){

  const geometry=feature.geometry;

  if(!geometry)return null;


  if(geometry.type==="MultiPolygon"){

    const polygons=geometry.coordinates.filter(
      polygon=>{

        const area=path.area({

          type:"Polygon",
          coordinates:polygon

        });

        return area>=100;

      }
    );


    if(!polygons.length){

      return null;

    }


    return {

      type:"Feature",

      properties:feature.properties||{},

      geometry:{

        type:"MultiPolygon",
        coordinates:polygons

      }

    };

  }


  if(geometry.type==="Polygon"){

    const area=path.area(feature);

    if(area<100){

      return null;

    }

  }


  return feature;

}


/* =========================
   데이터 불러오기
========================= */

async function init(){

  try{

    const [source,topology]=await Promise.all([

      fetch(
        "https://raw.githubusercontent.com/ybrstar/yb-setlist/main/index.html"
      ).then(r=>{

        if(!r.ok){

          throw Error("아카이브 연결 실패");

        }

        return r.text();

      }),


      fetch(
        "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-topo-simple.json"
      ).then(r=>{

        if(!r.ok){

          throw Error("지도 연결 실패");

        }

        return r.json();

      })

    ]);


    /* =====================
       아카이브 데이터 추출
    ===================== */

    const match=source.match(
      /\bconst\s+data\s*=\s*(\[[\s\S]*?\])\s*;/
    );


    if(!match){

      throw Error(
        "공연 데이터를 찾지 못했습니다."
      );

    }


    const records=Function(
      "return ("+match[1]+");"
    )();


    /* =====================
       YB + 윤허안 공연 추출
    ===================== */

    const missing=new Set();


    for(const row of records){

      const [
        date,
        title,
        region,
        venue,
        type
      ]=row;


      const text=
        String(title||"")+" "+
        String(type||"");


      const isYoonHuhAhn=
        /윤허안/.test(text);


      const isSolo=
        /윤도현/.test(text) &&
        !isYoonHuhAhn;


      /* 윤도현 솔로 공연 제외 */

      if(isSolo){

        continue;

      }


      const city=cityKey(region);

      const location=coords[city];


      if(!location){

        missing.add(region);

        continue;

      }


      /* 윤허안 공연명 표시 */

      const eventTitle=
        isYoonHuhAhn &&
        !/윤허안/.test(String(title))
          ?"윤허안 · "+title
          :title;


      /* 날짜별 공연 생성 */

      for(const day of dates(date)){

        if(day>END){

          continue;

        }


        shows.push({

          date:day,

          title:eventTitle,

          region,

          city,

          location,

          type,

          isYoonHuhAhn

        });

      }

    }


    /* =====================
       날짜순 정렬
    ===================== */

    shows.sort((a,b)=>

      a.date.localeCompare(b.date) ||

      a.title.localeCompare(b.title)

    );


    if(!shows.length){

      throw Error(
        "표시할 공연이 없습니다."
      );

    }


    /* =====================
       대한민국 지도 생성
    ===================== */

    const geo=topojson.feature(

      topology,

      topology.objects[
        Object.keys(topology.objects)[0]
      ]

    );


    const features=geo.features||[geo];


    /* 울릉도 독도를 지도 범위에 포함 */

    const extendedGeo={

      type:"FeatureCollection",

      features:[

        ...features,

        {

          type:"Feature",

          geometry:{

            type:"MultiPoint",

            coordinates:[

              coords.울릉도,

              coords.독도

            ]

          },

          properties:{}

        }

      ]

    };


    /* =====================
       지도 크기 및 위치

       제주도가 잘리지 않도록
       전체 지도를 조금 축소
    ===================== */

    projection=d3.geoMercator()
      .fitExtent(

        [
          [100,430],
          [800,1160]
        ],

        extendedGeo

      );


    const path=d3.geoPath(projection);

    const land=document.getElementById("land");


    /* =====================
       육지 표시

       작은 부속 섬 정리
    ===================== */

    features.forEach(feature=>{

      const simplified=simplifyFeature(
        feature,
        path
      );


      if(!simplified){

        return;

      }


      el("path",{

        d:path(simplified),

        fill:"#252525",

        stroke:"#555",

        "stroke-width":"1.4"

      },land);

    });


    /* =====================
       울릉도 / 독도 표시

       텍스트 없음
    ===================== */

    addIsland(

      "울릉도",

      coords.울릉도,

      land

    );


    addIsland(

      "독도",

      coords.독도,

      land

    );


    /* =====================
       공연 경로 생성
    ===================== */

    const routeLayer=
      document.getElementById("routes");


    const dotLayer=
      document.getElementById("dots");


    shows.forEach((s,i)=>{

      s.xy=projection(s.location);


      /* 공연 위치 점 */

      const dot=el("circle",{

        cx:s.xy[0],

        cy:s.xy[1],

        r:5,

        fill:"#ff3045",

        opacity:0

      },dotLayer);


      dots.push(dot);


      /* 첫 공연 */

      if(i===0){

        segments.push(null);

        return;

      }


      const previous=shows[i-1];


      /* =====================
         같은 도시 연속 공연

         고리 제거
      ===================== */

      if(s.city===previous.city){

        segments.push(null);

        return;

      }


      const d=makeCurve(

        previous.xy,

        s.xy,

        i

      );


      if(!d){

        segments.push(null);

        return;

      }


      /* 이동 경로 */

      const line=el("path",{

        d,

        fill:"none",

        stroke:"#ff3045",

        "stroke-width":3.2,

        "stroke-linecap":"round",

        opacity:0

      },routeLayer);


      const length=line.getTotalLength();


      line.style.strokeDasharray=length;

      line.style.strokeDashoffset=length;


      segments.push({

        line,

        length

      });

    });


    /* =====================
       데이터 안내
    ===================== */

    const cityCount=
      new Set(
        shows.map(s=>s.city)
      ).size;


    const yhaCount=
      shows.filter(
        s=>s.isYoonHuhAhn
      ).length;


    let msg=
      `${shows.length} SHOWS · `+
      `${cityCount} CITIES`+
      ` · 윤허안 ${yhaCount}회 포함`;


    /* 등록되지 않은 도시 안내 */

    if(missing.size){

      msg+=
        ` · 좌표 미등록: ${
          [...missing].join(", ")
        }`;

    }


    document.getElementById("message")
      .textContent=msg;


    replay();

  }


  catch(err){

    document.getElementById("message")
      .textContent=
        "오류: "+err.message;


    console.error(err);

  }

}


/* =========================
   공연 정보 표시
========================= */

function showInfo(index){

  const s=shows[index];


  if(!s)return;


  document.getElementById("date")
    .textContent=s.date;


  document.getElementById("city")
    .textContent=s.city.toUpperCase();


  document.getElementById("event")
    .textContent=s.title;


  document.getElementById("count")
    .textContent=
      String(index+1).padStart(2,"0");

}


/* =========================
   인트로 타이핑
========================= */

function renderIntro(t){

  const year="2026";

  const title="YB ROAD";


  const yearCount=Math.min(

    year.length,

    Math.floor(t/140)

  );


  document.getElementById("introYear")
    .textContent=
      year.slice(0,yearCount);


  const titleTime=Math.max(
    0,
    t-900
  );


  const titleCount=Math.min(

    title.length,

    Math.floor(titleTime/115)

  );


  document.getElementById("introText")
    .textContent=
      title.slice(0,titleCount);


  document.getElementById("introDot")
    .textContent=
      titleCount===title.length?".":"";


  /* 지도 전환 */

  const intro=
    document.getElementById("intro");


  const mapScreen=
    document.getElementById("mapScreen");


  if(t>=2600){

    intro.style.opacity="0";

    mapScreen.style.opacity="1";

  }

  else{

    intro.style.opacity="1";

    mapScreen.style.opacity="0";

  }


  intro.style.pointerEvents=
    t>=INTRO?"none":"auto";

}


/* =========================
   지도 애니메이션
========================= */

function render(t){

  renderIntro(t);


  if(t<INTRO){

    return;

  }


  const progress=Math.max(

    0,

    Math.min(

      1,

      (t-INTRO)/TRAVEL

    )

  );


  const position=
    progress*(shows.length-1);


  const index=Math.floor(position);


  const fraction=position-index;


  /* 마지막 장면 여부 */

  const isFinal=
    t>=INTRO+TRAVEL;


  /* =====================
     공연 위치 점 표시
  ===================== */

  dots.forEach((dot,i)=>{

    let opacity=0;


    if(isFinal){

      /* 마지막에는 모든 점 선명하게 */

      opacity=.95;

    }

    else if(i<=index){

      /* 현재 공연은 밝게 */

      opacity=i===index?1:.42;

    }


    dot.setAttribute(
      "opacity",
      opacity
    );

  });


  /* =====================
     이동 경로 표시
  ===================== */

  segments.forEach((seg,i)=>{

    if(!seg)return;


    /* =====================
       마지막 장면

       모든 경로 선명하게
    ===================== */

    if(isFinal){

      seg.line.setAttribute(
        "opacity",
        .95
      );


      seg.line.setAttribute(
        "stroke-width",
        3.2
      );


      seg.line.style.strokeDashoffset=0;


      return;

    }


    let visible=0;


    if(i<=index){

      visible=1;

    }

    else if(i===index+1){

      visible=fraction;

    }


    /* 아직 지나지 않은 경로 */

    if(visible===0){

      seg.line.setAttribute(
        "opacity",
        0
      );

    }


    /* 현재 이동 중인 경로 */

    else if(visible<1){

      seg.line.setAttribute(
        "opacity",
        .95
      );

    }


    /* =====================
       지나간 경로

       시간이 지날수록 흐리게
    ===================== */

    else{

      const age=Math.max(
        0,
        index-i
      );


      const opacity=Math.max(

        .09,

        .72*Math.exp(-age/3)

      );


      seg.line.setAttribute(
        "opacity",
        opacity
      );

    }


    seg.line.style.strokeDashoffset=
      seg.length*(1-visible);

  });


  /* =====================
     현재 이동 위치
  ===================== */

  let point=
    shows[
      Math.min(
        index,
        shows.length-1
      )
    ].xy;


  if(
    index<shows.length-1 &&
    fraction>0
  ){

    const seg=segments[index+1];


    if(seg){

      const p=seg.line.getPointAtLength(

        seg.length*fraction

      );


      point=[p.x,p.y];

    }

    else{

      /* 같은 도시 이동 없음 */

      point=shows[index+1].xy;

    }

  }


  /* =====================
     현재 위치 빛나는 효과
  ===================== */

  const pulse=Math.sin(t/140)*4;


  for(const [id,r] of [

    ["active",10],

    ["halo",23]

  ]){

    const node=
      document.getElementById(id);


    node.setAttribute(
      "cx",
      point[0]
    );


    node.setAttribute(
      "cy",
      point[1]
    );


    node.setAttribute(

      "r",

      Math.max(1,r+pulse)

    );


    node.setAttribute(

      "opacity",

      isFinal
        ?0
        :(id==="halo"?.2:1)

    );

  }


  /* =====================
     공연 정보 업데이트
  ===================== */

  const current=Math.min(

    shows.length-1,

    index+(fraction>.5?1:0)

  );


  if(
    current!==lastIndex &&
    !isFinal
  ){

    showInfo(current);

    lastIndex=current;

  }


  /* =====================
     진행 바
  ===================== */

  document.getElementById("bar")
    .style.width=
      (progress*100)+"%";


  /* =====================
     마지막 장면
  ===================== */

  if(isFinal){

    const firstDate=
      shows[0].date;


    const lastDate=
      shows[shows.length-1].date;


    /* 날짜 */

    document.getElementById("date")
      .textContent=
        firstDate+" — "+lastDate;


    /* 제목 */

    document.getElementById("city")
      .textContent=
        "2026 YB ROAD.";


    /* 도시 수 */

    const cityCount=
      new Set(
        shows.map(s=>s.city)
      ).size;


    /* 공연 횟수 + 도시 수 */

    document.getElementById("event")
      .textContent=
        `${shows.length} SHOWS · ${cityCount} CITIES`;


    /* 우측 공연 횟수 */

    document.getElementById("count")
      .textContent=
        String(shows.length)
          .padStart(2,"0");


    /* 마지막 화면 스타일 */

    document.getElementById("infoBox")
      .classList.add("final");

  }

}


/* =========================
   재생
========================= */

function tick(now){

  const t=Math.min(

    TOTAL,

    (now-started)*playbackSpeed

  );


  render(t);


  if(t<TOTAL){

    raf=requestAnimationFrame(tick);

  }

  else{

    raf=0;

  }

}


/* =========================
   재생 속도 변경
========================= */

function setSpeed(speed,button){

  /*
     재생 도중 속도를 변경해도
     현재 위치부터 이어서 재생
  */

  if(started>0){

    const now=performance.now();


    const elapsed=
      (now-started)*playbackSpeed;


    started=
      now-elapsed/speed;

  }


  playbackSpeed=speed;


  document.querySelectorAll(
    ".speed-buttons button"
  ).forEach(btn=>{

    btn.classList.remove("active");

  });


  button.classList.add("active");

}


/* =========================
   다시 재생
========================= */

function replay(){

  if(!shows.length)return;


  cancelAnimationFrame(raf);


  lastIndex=-1;


  /* =====================
     인트로 초기화
  ===================== */

  document.getElementById("intro")
    .style.opacity="1";


  document.getElementById("intro")
    .style.pointerEvents="auto";


  document.getElementById("mapScreen")
    .style.opacity="0";


  document.getElementById("introYear")
    .textContent="";


  document.getElementById("introText")
    .textContent="";


  document.getElementById("introDot")
    .textContent="";


  /* =====================
     진행 바 초기화
  ===================== */

  document.getElementById("bar")
    .style.width="0%";


  /* =====================
     공연 횟수 초기화
  ===================== */

  document.getElementById("count")
    .textContent="00";


  /* =====================
     공연 정보 초기화
  ===================== */

  document.getElementById("date")
    .textContent=
      shows[0].date;


  document.getElementById("city")
    .textContent=
      "YB ON THE ROAD";


  document.getElementById("event")
    .textContent=
      "2026년, 우리가 지나온 무대들";


  document.getElementById("infoBox")
    .classList.remove("final");


  /* =====================
     경로 초기화
  ===================== */

  segments.forEach(seg=>{

    if(!seg)return;


    seg.line.setAttribute(
      "opacity",
      0
    );


    seg.line.style.strokeDashoffset=
      seg.length;

  });


  /* 공연 위치 점 초기화 */

  dots.forEach(dot=>{

    dot.setAttribute(
      "opacity",
      0
    );

  });


  /* 빛나는 점 초기화 */

  document.getElementById("active")
    .setAttribute("opacity",0);


  document.getElementById("halo")
    .setAttribute("opacity",0);


  /* =====================
     애니메이션 시작
  ===================== */

  started=performance.now();


  raf=requestAnimationFrame(tick);

}


/* =========================
   전체화면
========================= */

function fullscreen(){

  const stage=
    document.getElementById("stage");


  if(stage.requestFullscreen){

    stage.requestFullscreen();

  }

}


/* =========================
   시작
========================= */

init();

</script>
