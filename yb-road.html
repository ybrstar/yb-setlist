<script>

/* =========================
   기본 설정
========================= */

/* 한국 날짜 자동 계산 */

const END = new Intl.DateTimeFormat("sv-SE",{
  timeZone:"Asia/Seoul",
  year:"numeric",
  month:"2-digit",
  day:"2-digit"
})
.format(new Date())
.replaceAll("-",".");


/* 애니메이션 시간 */

const INTRO=3200;
const TRAVEL=32000;
const OUTRO=4000;

const TOTAL=INTRO+TRAVEL+OUTRO;


/* =========================
   도시 좌표
========================= */

const coords={

  /* 수도권 */

  서울:[126.978,37.566],
  인천:[126.705,37.456],
  수원:[127.029,37.263],
  화성:[126.832,37.200],
  용인:[127.177,37.241],
  안양:[126.956,37.394],
  안성:[127.279,37.008],
  과천:[126.987,37.429],
  고양:[126.832,37.658],
  파주:[126.780,37.760],
  의정부:[127.047,37.738],
  동두천:[127.061,37.904],
  이천:[127.443,37.272],

  경기광주:[127.255,37.429],

  /* 강원 */

  강릉:[128.876,37.752],
  원주:[127.946,37.342],
  삼척:[129.165,37.450],
  춘천:[127.730,37.881],

  /* 충청 */

  대전:[127.384,36.350],
  세종:[127.289,36.480],
  천안:[127.153,36.815],
  아산:[127.004,36.789],
  공주:[127.120,36.446],
  계룡:[127.248,36.275],
  보령:[126.613,36.333],
  청주:[127.489,36.642],
  괴산:[127.786,36.815],
  영동:[127.775,36.175],

  /* 전라 */

  광주:[126.852,35.160],
  담양:[126.989,35.321],
  장성:[126.785,35.301],
  순천:[127.489,34.950],
  곡성:[127.292,35.282],
  전주:[127.148,35.824],

  /* 경상 */

  대구:[128.602,35.872],
  포항:[129.365,36.019],
  의성:[128.697,36.353],
  부산:[129.075,35.180],
  울산:[129.311,35.539],
  함양:[127.725,35.520],

  /* 제주 */

  제주:[126.532,33.500],
  서귀포:[126.560,33.254],

  /* 울릉도와 독도 */

  울릉도:[130.905,37.484],
  독도:[131.869,37.242]

};


/* =========================
   변수
========================= */

let shows=[];
let segments=[];
let dots=[];

let projection;

let started=0;
let raf=0;
let lastIndex=-1;

let playbackSpeed=1;

let totalDistance=0;

const NS="http://www.w3.org/2000/svg";


/* =========================
   SVG 생성
========================= */

function el(tag,attrs,parent){

  const node=document.createElementNS(NS,tag);

  for(const [k,v] of Object.entries(attrs)){
    node.setAttribute(k,v);
  }

  parent.appendChild(node);

  return node;

}


/* =========================
   지역명 추출
========================= */

function cityKey(region){

  const p=String(region||"")
    .trim()
    .split(/\s+/);

  const normalize=name=>
    name.replace(
      /(특별자치시|특별자치도|광역시|특별시|자치시|시|군|구)$/,
      ""
    );

  const first=normalize(p[0]||"");

  const metro=[
    "서울","인천","광주",
    "대구","대전","부산",
    "울산","세종","제주"
  ];

  /* 광주광역시와 경기도 광주 구분 */

  if(
    /^(경기|경기도)$/.test(p[0]) &&
    p.some(x=>normalize(x)==="광주")
  ){
    return "경기광주";
  }

  if(metro.includes(first)){
    return first;
  }

  for(const token of [...p].reverse()){

    const name=normalize(token);

    if(coords[name]){
      return name;
    }

  }

  return normalize(p[p.length-1]||"");

}


/* =========================
   공연 날짜 분리
========================= */

function dates(str){

  const normalized=String(str)
    .replace(/[–—~〜]/g,"-");

  const m=normalized.match(
    /^(\d{4})\.(\d{1,2})\.(\d{1,2})(?:\s*-\s*(?:(\d{4})\.)?(?:(\d{1,2})\.)?(\d{1,2}))?/
  );

  if(!m)return [];

  const year=Number(m[1]);
  const month=Number(m[2]);
  const day=Number(m[3]);

  const start=Date.UTC(
    year,
    month-1,
    day
  );

  const end=m[6]
    ?Date.UTC(
        Number(m[4]||year),
        Number(m[5]||month)-1,
        Number(m[6])
      )
    :start;

  if(end<start)return [];

  if(end-start>32*86400000)return [];

  const result=[];

  for(let t=start;t<=end;t+=86400000){

    result.push(
      new Date(t)
        .toISOString()
        .slice(0,10)
        .replaceAll("-",".")
    );

  }

  return result;

}


/* =========================
   직선거리 계산
========================= */

/*
   두 도시의 위도와 경도를 이용해
   구면상 최단거리 계산

   단위: KM

   실제 도로 이동거리와 다름
*/

function haversine(a,b){

  const R=6371;

  const toRad=d=>d*Math.PI/180;

  const lat1=toRad(a[1]);
  const lat2=toRad(b[1]);

  const dLat=toRad(b[1]-a[1]);
  const dLon=toRad(b[0]-a[0]);

  const h=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*
    Math.cos(lat2)*
    Math.sin(dLon/2)**2;

  return 2*R*Math.asin(
    Math.sqrt(Math.min(1,h))
  );

}


/* =========================
   이동 경로 곡선
========================= */

function makeCurve(a,b,index){

  const dx=b[0]-a[0];
  const dy=b[1]-a[1];

  const dist=Math.hypot(dx,dy);

  /* 같은 위치는 이동선 없음 */

  if(dist<2){
    return null;
  }

  const bend=
    Math.min(85,dist*.18)*
    (index%2?1:-1);

  const mx=(a[0]+b[0])/2;
  const my=(a[1]+b[1])/2;

  const nx=-dy/dist;
  const ny=dx/dist;

  return `
    M${a[0]},${a[1]}
    Q${mx+nx*bend},${my+ny*bend}
    ${b[0]},${b[1]}
  `;

}


/* =========================
   울릉도 / 독도 표시
========================= */

function addIsland(name,location,land){

  const xy=projection(location);

  if(!xy)return;

  const x=xy[0];
  const y=xy[1];

  /* 섬 표시 */

  if(name==="독도"){

    el("ellipse",{
      cx:x-3,
      cy:y,
      rx:3.5,
      ry:5,
      fill:"#555",
      stroke:"#888",
      "stroke-width":1
    },land);

    el("ellipse",{
      cx:x+4,
      cy:y+2,
      rx:2.5,
      ry:4,
      fill:"#555",
      stroke:"#888",
      "stroke-width":1
    },land);

  }else{

    el("ellipse",{
      cx:x,
      cy:y,
      rx:7,
      ry:9,
      fill:"#555",
      stroke:"#888",
      "stroke-width":1.2
    },land);

  }

  /* 섬 이름 */

  const label=el("text",{
    x:x-12,
    y:y-13,
    fill:"#aaa",
    "font-size":19,
    "font-weight":700,
    "text-anchor":"end"
  },land);

  label.textContent=name;

}


/* =========================
   데이터 불러오기
========================= */

async function init(){

  try{

    const [source,topology]=await Promise.all([

      fetch(
        "https://raw.githubusercontent.com/ybrstar/yb-setlist/main/index.html"
      ).then(r=>{

        if(!r.ok){
          throw Error("아카이브 연결 실패");
        }

        return r.text();

      }),

      fetch(
        "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-topo-simple.json"
      ).then(r=>{

        if(!r.ok){
          throw Error("지도 연결 실패");
        }

        return r.json();

      })

    ]);


    /* =====================
       아카이브 데이터 추출
    ===================== */

    const match=source.match(
      /const data\s*=\s*(\[[\s\S]*?\n\s*\];)/
    );

    if(!match){
      throw Error("공연 데이터를 찾지 못했습니다.");
    }

    const records=Function(
      "return "+match[1].slice(0,-1)
    )();


    /* =====================
       YB + 윤허안 공연 추출
    ===================== */

    const missing=new Set();

    for(const row of records){

      const [
        date,
        title,
        region,
        venue,
        type
      ]=row;

      const text=
        String(title||"")+" "+
        String(type||"");

      const isYoonHuhAhn=
        /윤허안/.test(text);

      const isSolo=
        /윤도현/.test(text)&&
        !isYoonHuhAhn;

      /* 윤도현 솔로 공연만 제외 */

      if(isSolo){
        continue;
      }

      const city=cityKey(region);

      const location=coords[city];

      if(!location){

        missing.add(region);
        continue;

      }

      const eventTitle=
        isYoonHuhAhn &&
        !/윤허안/.test(String(title))
          ?"윤허안 · "+title
          :title;

      for(const day of dates(date)){

        if(day>END)continue;

        shows.push({

          date:day,
          title:eventTitle,
          region,
          city,
          location,
          type,
          isYoonHuhAhn

        });

      }

    }


    /* 날짜순 정렬 */

    shows.sort((a,b)=>
      a.date.localeCompare(b.date)||
      a.title.localeCompare(b.title)
    );

    if(!shows.length){
      throw Error("표시할 공연이 없습니다.");
    }


    /* =====================
       총 이동 거리 계산
    ===================== */

    totalDistance=0;

    shows.forEach((s,i)=>{

      if(i===0){

        s.cumulativeKm=0;
        return;

      }

      const previous=shows[i-1];

      /* 같은 도시는 거리 추가 안 함 */

      if(s.city!==previous.city){

        totalDistance+=haversine(
          previous.location,
          s.location
        );

      }

      s.cumulativeKm=totalDistance;

    });


    /* =====================
       대한민국 지도 생성
    ===================== */

    const geo=topojson.feature(
      topology,
      topology.objects[
        Object.keys(topology.objects)[0]
      ]
    );

    const features=geo.features||[geo];


    /*
       울릉도와 독도를 투영 범위에 포함
       지도 밖으로 잘리지 않도록 처리
    */

    const extendedGeo={

      type:"FeatureCollection",

      features:[

        ...features,

        {
          type:"Feature",

          geometry:{
            type:"MultiPoint",

            coordinates:[
              coords.울릉도,
              coords.독도
            ]
          },

          properties:{}
        }

      ]

    };


    /* 확대된 지도 투영 */

    projection=d3.geoMercator()
      .fitExtent(
        [[55,420],[845,1230]],
        extendedGeo
      );


    const path=d3.geoPath(projection);

    const land=document.getElementById("land");


    features.forEach(f=>{

      el("path",{

        d:path(f),
        fill:"#252525",
        stroke:"#555",
        "stroke-width":"1.4"

      },land);

    });


    /* 울릉도 / 독도 표시 */

    addIsland(
      "울릉도",
      coords.울릉도,
      land
    );

    addIsland(
      "독도",
      coords.독도,
      land
    );


    /* =====================
       공연 경로 생성
    ===================== */

    const routeLayer=
      document.getElementById("routes");

    const dotLayer=
      document.getElementById("dots");


    shows.forEach((s,i)=>{

      s.xy=projection(s.location);


      /* 공연 위치 점 */

      const dot=el("circle",{

        cx:s.xy[0],
        cy:s.xy[1],
        r:5,
        fill:"#ff3045",
        opacity:0

      },dotLayer);

      dots.push(dot);


      /* 첫 공연은 이전 이동 경로 없음 */

      if(i===0){

        segments.push(null);
        return;

      }


      const previous=shows[i-1];


      /*
         같은 도시 연속 공연이면
         고리를 만들지 않음
      */

      if(s.city===previous.city){

        segments.push(null);
        return;

      }


      const d=makeCurve(
        previous.xy,
        s.xy,
        i
      );


      if(!d){

        segments.push(null);
        return;

      }


      const line=el("path",{

        d,
        fill:"none",
        stroke:"#ff3045",
        "stroke-width":3.2,
        "stroke-linecap":"round",
        opacity:0

      },routeLayer);


      const length=line.getTotalLength();

      line.style.strokeDasharray=length;
      line.style.strokeDashoffset=length;


      segments.push({

        line,
        length

      });

    });


    /* =====================
       데이터 안내
    ===================== */

    const cityCount=
      new Set(shows.map(s=>s.city)).size;

    const yhaCount=
      shows.filter(s=>s.isYoonHuhAhn).length;

    let msg=
      `${shows.length} SHOWS · `+
      `${cityCount} CITIES · `+
      `${Math.round(totalDistance).toLocaleString("ko-KR")} KM`+
      ` · 윤허안 ${yhaCount}회 포함`;


    if(missing.size){

      msg+=
        ` · 좌표 미등록: ${
          [...missing].join(", ")
        }`;

    }


    document.getElementById("message")
      .textContent=msg;


    replay();

  }

  catch(err){

    document.getElementById("message")
      .textContent="오류: "+err.message;

    console.error(err);

  }

}


/* =========================
   공연 정보 표시
========================= */

function showInfo(index){

  const s=shows[index];

  if(!s)return;


  document.getElementById("date")
    .textContent=s.date;


  document.getElementById("city")
    .textContent=s.city.toUpperCase();


  document.getElementById("event")
    .textContent=s.title;


  document.getElementById("count")
    .textContent=
      String(index+1).padStart(2,"0");

}


/* =========================
   인트로 타이핑
========================= */

function renderIntro(t){

  const year="2026";
  const title="YB ROAD";


  const yearCount=Math.min(
    year.length,
    Math.floor(t/140)
  );


  document.getElementById("introYear")
    .textContent=year.slice(0,yearCount);


  const titleTime=Math.max(0,t-900);


  const titleCount=Math.min(
    title.length,
    Math.floor(titleTime/115)
  );


  document.getElementById("introText")
    .textContent=title.slice(0,titleCount);


  document.getElementById("introDot")
    .textContent=
      titleCount===title.length?".":"";


  const intro=document.getElementById("intro");

  const mapScreen=document.getElementById("mapScreen");


  if(t>=2600){

    intro.style.opacity="0";
    mapScreen.style.opacity="1";

  }else{

    intro.style.opacity="1";
    mapScreen.style.opacity="0";

  }


  intro.style.pointerEvents=
    t>=INTRO?"none":"auto";

}


/* =========================
   지도 애니메이션
========================= */

function render(t){

  renderIntro(t);

  if(t<INTRO)return;


  const progress=Math.max(
    0,
    Math.min(
      1,
      (t-INTRO)/TRAVEL
    )
  );


  const position=
    progress*(shows.length-1);

  const index=Math.floor(position);

  const fraction=position-index;


  /* =====================
     공연 지점 표시
  ===================== */

  dots.forEach((dot,i)=>{

    let opacity=0;

    if(i<=index){

      opacity=i===index?1:.42;

    }

    dot.setAttribute(
      "opacity",
      opacity
    );

  });


  /* =====================
     이동 경로 그리기
  ===================== */

  segments.forEach((seg,i)=>{

    if(!seg)return;

    let visible=0;


    if(i<=index){

      visible=1;

    }

    else if(i===index+1){

      visible=fraction;

    }


    if(visible===0){

      seg.line.setAttribute(
        "opacity",0
      );

    }

    else if(visible<1){

      /*
         현재 그려지는 이동 경로
         선명한 빨간색
      */

      seg.line.setAttribute(
        "opacity",.95
      );

    }

    else{

      /*
         지나간 경로는 점점 흐리게
      */

      const age=Math.max(
        0,
        index-i
      );

      const opacity=Math.max(
        .09,
        .72*Math.exp(-age/3)
      );

      seg.line.setAttribute(
        "opacity",
        opacity
      );

    }


    seg.line.style.strokeDashoffset=
      seg.length*(1-visible);

  });


  /* =====================
     현재 이동 위치
  ===================== */

  let point=
    shows[Math.min(index,shows.length-1)].xy;


  if(
    index<shows.length-1 &&
    fraction>0
  ){

    const seg=segments[index+1];


    if(seg){

      const p=seg.line.getPointAtLength(
        seg.length*fraction
      );

      point=[p.x,p.y];

    }

    else{

      /*
         같은 도시 연속 공연:
         고리 없이 해당 위치 유지
      */

      point=shows[index+1].xy;

    }

  }


  /* =====================
     빨간 점 빛나는 효과
  ===================== */

  const pulse=Math.sin(t/140)*4;


  for(const [id,r] of [

    ["active",10],
    ["halo",23]

  ]){

    const node=document.getElementById(id);

    node.setAttribute("cx",point[0]);
    node.setAttribute("cy",point[1]);

    node.setAttribute(
      "r",
      Math.max(1,r+pulse)
    );

    node.setAttribute(
      "opacity",
      id==="halo"?.2:1
    );

  }


  /* =====================
     공연 정보 업데이트
  ===================== */

  const current=Math.min(
    shows.length-1,
    index+(fraction>.5?1:0)
  );


  if(current!==lastIndex){

    showInfo(current);

    lastIndex=current;

  }


  /* =====================
     진행 바
  ===================== */

  document.getElementById("bar")
    .style.width=(progress*100)+"%";


  /* =====================
     마지막 장면
  ===================== */

  if(t>=INTRO+TRAVEL){

    const firstDate=shows[0].date;

    const lastDate=
      shows[shows.length-1].date;


    document.getElementById("date")
      .textContent=
        firstDate+" — "+lastDate;


    document.getElementById("city")
      .textContent=
        "2026 YB ROAD.";


    const cityCount=
      new Set(shows.map(s=>s.city)).size;


    document.getElementById("event")
      .textContent=
        `${shows.length} SHOWS · ${cityCount} CITIES`;


    document.getElementById("count")
      .textContent=
        String(shows.length).padStart(2,"0");


    /* 총 이동 거리 */

    document.getElementById("distanceValue")
      .textContent=
        Math.round(totalDistance)
          .toLocaleString("ko-KR")+" KM";


    document.getElementById("distanceRow")
      .style.display="block";


    document.getElementById("distanceNote")
      .style.display="block";


    document.getElementById("infoBox")
      .classList.add("final");

  }

}


/* =========================
   재생
========================= */

function tick(now){

  const t=Math.min(
    TOTAL,
    (now-started)*playbackSpeed
  );


  render(t);


  if(t<TOTAL){

    raf=requestAnimationFrame(tick);

  }else{

    raf=0;

  }

}


/* =========================
   재생 속도 변경
========================= */

function setSpeed(speed,button){

  /*
     재생 도중 속도를 바꿔도
     현재 위치부터 이어서 재생
  */

  if(started>0){

    const now=performance.now();

    const elapsed=
      (now-started)*playbackSpeed;

    started=
      now-elapsed/speed;

  }


  playbackSpeed=speed;


  document.querySelectorAll(
    ".speed-buttons button"
  ).forEach(btn=>{

    btn.classList.remove("active");

  });


  button.classList.add("active");

}


/* =========================
   다시 재생
========================= */

function replay(){

  if(!shows.length)return;


  cancelAnimationFrame(raf);

  lastIndex=-1;


  /* 인트로 초기화 */

  document.getElementById("intro")
    .style.opacity="1";

  document.getElementById("intro")
    .style.pointerEvents="auto";

  document.getElementById("mapScreen")
    .style.opacity="0";


  document.getElementById("introYear")
    .textContent="";

  document.getElementById("introText")
    .textContent="";

  document.getElementById("introDot")
    .textContent="";


  /* 진행 바 초기화 */

  document.getElementById("bar")
    .style.width="0%";


  /* 공연 횟수 초기화 */

  document.getElementById("count")
    .textContent="00";


  /* 공연 정보 초기화 */

  document.getElementById("date")
    .textContent=shows[0].date;

  document.getElementById("city")
    .textContent="YB ON THE ROAD";

  document.getElementById("event")
    .textContent="2026년, 우리가 지나온 무대들";


  /* 이동 거리 초기화 */

  document.getElementById("distanceRow")
    .style.display="none";

  document.getElementById("distanceNote")
    .style.display="none";

  document.getElementById("infoBox")
    .classList.remove("final");


  /* 애니메이션 시작 */

  started=performance.now();

  raf=requestAnimationFrame(tick);

}


/* =========================
   전체화면
========================= */

function fullscreen(){

  const stage=document.getElementById("stage");

  if(stage.requestFullscreen){

    stage.requestFullscreen();

  }

}


/* =========================
   시작
========================= */

init();

</script>
